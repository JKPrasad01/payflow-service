spring.application.name=payflow-service

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/payflow
spring.datasource.username=payflow_app
spring.datasource.password=${PAYFLOW_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway migrations
spring.flyway.enabled=true

# Server
server.port=8080

#Razorpay configuration
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}

razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}


spring.http.client.connect-timeout=3s
spring.http.client.read-timeout=10s